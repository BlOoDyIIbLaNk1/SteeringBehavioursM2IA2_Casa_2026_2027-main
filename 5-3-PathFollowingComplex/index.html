<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <script src="path.js"></script>
    <script src="vehicle.js"></script>
    <script src="snakeSegment.js"></script>
    <script src="snake.js"></script>
    <script src="snakePathFollowing.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <header id="controls">
      <label for="snake-follow">Poids follow du serpent</label>
      <input id="snake-follow" type="range" min="0" max="5" step="0.1" value="2">
      <output id="snake-follow-value" for="snake-follow">2.0</output>
      <label for="snake-separation">Poids séparation du serpent</label>
      <input id="snake-separation" type="range" min="0" max="5" step="0.1" value="1.2">
      <output id="snake-separation-value" for="snake-separation">1.2</output>
      <label for="circuit-width">Largeur du circuit</label>
      <input id="circuit-width" type="range" min="10" max="100" step="1" value="20">
      <output id="circuit-width-value" for="circuit-width">20 px</output>
      <label for="snake-spacing">Distance entre anneaux</label>
      <input id="snake-spacing" type="range" min="5" max="80" step="1" value="20">
      <output id="snake-spacing-value" for="snake-spacing">20 px</output>
      <label for="snake-size">Taille des serpents</label>
      <input id="snake-size" type="range" min="8" max="60" step="1" value="22">
      <output id="snake-size-value" for="snake-size">22 px</output>
      <span>T : ajouter un serpent au pointeur · D : debug · Glisser dans le canvas : ajouter des véhicules</span>
      <output id="snake-count" aria-live="polite">1 serpent</output>
    </header>
  </body>
</html>
